# Wird von publish_release.ps1 automatisch nach .github/workflows/docker-image.yml im
# GitHub-Repo hochgeladen und nach jedem Release gestartet.
# Baut das Docker-Image aus dem NAS-Paket des Releases und veroeffentlicht es auf
# Docker Hub (midnox1/midnox-studio) und in der GitHub-Registry (ghcr.io/svennie7480/midnox-studio).
name: Docker-Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag, z. B. v2.1.0"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: NAS-Paket aus dem Release holen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          VER="${TAG#v}"
          for i in 1 2 3 4 5 6; do
            gh release download "$TAG" --repo "${{ github.repository }}" --pattern "MIDNOX_Studio_NAS_v${VER}.zip" --clobber && break
            echo "NAS-Paket noch nicht da - warte 20 s ..."; sleep 20
          done
          unzip -q "MIDNOX_Studio_NAS_v${VER}.zip"
          test -f midnox-studio/Dockerfile
          echo "VER=${VER}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Anmelden bei Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Anmelden bei der GitHub-Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image bauen und hochladen
        uses: docker/build-push-action@v6
        with:
          context: midnox-studio
          platforms: linux/amd64
          push: true
          build-args: APP_VERSION=${{ env.VER }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VER }}
          tags: |
            midnox1/midnox-studio:${{ env.VER }}
            midnox1/midnox-studio:latest
            ghcr.io/svennie7480/midnox-studio:${{ env.VER }}
            ghcr.io/svennie7480/midnox-studio:latest
